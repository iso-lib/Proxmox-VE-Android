name: Release APK

# Formal signed release build. Triggered manually only, so no release is
# produced by an ordinary push. Requires these repository secrets, the same
# names the beta workflow uses:
#   ANDROID_RELEASE_KEYSTORE_BASE64
#   ANDROID_RELEASE_KEYSTORE_PASSWORD
#   ANDROID_RELEASE_KEY_ALIAS
#   ANDROID_RELEASE_KEY_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build and sign release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship ANDROID_HOME (cmdline-tools,
      # build-tools, platforms). setup-android@v3 with no inputs tries
      # to install the removed 'tools' package and fails, so it is omitted.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Require signing secrets
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_KEYSTORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "$name is required before a signed release APK can be built."
              missing=1
            fi
          done
          exit "$missing"

      - name: Sign release APK
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          unsigned_apk="$(find app/build/outputs/apk/release -name '*-release-unsigned.apk' | sort | head -n 1)"
          if [ -z "$unsigned_apk" ]; then
            echo "No unsigned release APK was produced."
            exit 1
          fi
          aligned_apk="$RUNNER_TEMP/proxmox-ve-android-release-aligned.apk"
          signed_apk="release-artifacts/proxmox-ve-android-release.apk"
          keystore="$RUNNER_TEMP/release.keystore"
          zipalign="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"

          if [ -z "$zipalign" ] || [ -z "$apksigner" ]; then
            echo "Android build tools did not provide zipalign and apksigner."
            exit 1
          fi

          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_RELEASE_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_RELEASE_KEY_PASSWORD" \
            --out "$signed_apk" \
            "$aligned_apk"
          "$apksigner" verify --verbose "$signed_apk"
          rm -f "$keystore"

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxmox-ve-android-release
          path: release-artifacts/*.apk
          if-no-files-found: error
